name: Build Zoomies (Windows & macOS)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          python build_executable.py

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/Zoomies_Windows" -Force
          Copy-Item -Path "dist/Zoomies.exe" -Destination "dist/Zoomies_Windows/"
          if (Test-Path "characters") { Copy-Item -Path "characters" -Destination "dist/Zoomies_Windows/" -Recurse }
          if (Test-Path "songs") { Copy-Item -Path "songs" -Destination "dist/Zoomies_Windows/" -Recurse }
          if (Test-Path "themes") { Copy-Item -Path "themes" -Destination "dist/Zoomies_Windows/" -Recurse }
          Compress-Archive -Path "dist/Zoomies_Windows/*" -DestinationPath "dist/Zoomies_Windows.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoomies-Windows
          path: dist/Zoomies_Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS app bundle
        run: |
          python3 build_executable.py

      - name: Zip macOS App Bundle
        run: |
          cd dist
          zip -r Zoomies_macOS.zip Zoomies.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoomies-macOS
          path: dist/Zoomies_macOS.zip

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Zoomies-Windows
          path: release_artifacts

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Zoomies-macOS
          path: release_artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
